<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Central users and roles</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../studio-mockups/mockup.css"><style>
.studio-nav { background: var(--ink); border-radius: 18px; padding: 7px; display: flex; gap: 6px; }
.studio-nav a { height: 36px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 11px; font-size: 13px; font-weight: 600; color: var(--on-ink-muted); }
.studio-nav a.on { background: var(--signal); color: var(--ink); }
.levels { display: flex; gap: 6px; flex-wrap: wrap; }
.levels span { height: 34px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 11px; font-size: 13px; font-weight: 600; background: var(--paper); color: var(--body); }
.levels span.on { background: var(--signal-soft); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.levels small { color: var(--muted); font-weight: 600; }
.step-label { width: 1440px; margin: 0 28px 14px; display: flex; align-items: center; gap: 12px; }
.step-label b { width: 32px; height: 32px; border-radius: 99px; background: var(--ink); color: var(--signal); display: inline-flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; flex-shrink: 0; }
.step-label span { font-size: 15px; color: var(--body); } .step-label strong { color: var(--ink); }
.panel { width: 440px; flex-shrink: 0; background: var(--paper); border-radius: 24px; display: flex; flex-direction: column; min-height: 690px; }
.ph { padding: 18px 20px 14px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line-soft); }
.ph .ic { width: 42px; height: 42px; border-radius: 13px; background: var(--ink); color: var(--signal); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.ph h2 { margin: 0; font-size: 21px; }
.ph .sub { display: flex; gap: 6px; margin-top: 6px; }
.icb { width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pb { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.sec { border: 1px solid var(--line); border-radius: 16px; }
.sec header { display: flex; align-items: center; padding: 10px 12px 4px; } .sec header strong { flex: 1; font-size: 14px; }
.sec .line { padding: 0 12px 10px; font-size: 13px; color: var(--body); }
.edit { height: 30px; padding: 0 10px; border-radius: 9px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); display: inline-flex; align-items: center; white-space: nowrap; }
.edit.dark { background: var(--ink); color: var(--mist); border-color: var(--ink); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--mist); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; }
.tile b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; } .tile span { font-size: 11.5px; color: var(--muted); }
/* access level: none / view / edit / full */
.lvl { display: inline-flex; gap: 3px; vertical-align: middle; } .lvl i { width: 9px; height: 9px; border-radius: 3px; background: var(--line); }
.lvl.v i:nth-child(-n+1), .lvl.e i:nth-child(-n+3), .lvl.f i { background: var(--cobalt); }
.area { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 13px; border-top: 1px solid var(--line-soft); }
.area span:first-child { flex: 1; } .area em { font-style: normal; color: var(--muted); font-size: 12px; width: 92px; text-align: end; }
/* grid pages */
.grid { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.grid th { font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
.grid th:first-child, .grid td:first-child { text-align: start; }
.grid td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); text-align: center; }
.grid tr.areah td { background: var(--mist); font-weight: 700; font-size: 13px; padding: 9px 12px; }
.grid tr.areah td .hint { font-weight: 500; }
.cb { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #9FB0AA; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; vertical-align: middle; }
.cb.on { background: var(--ink); border-color: var(--ink); color: var(--signal); }
.cb.chg { box-shadow: 0 0 0 3px var(--signal); }
.savebar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--mist); border-radius: 18px; padding: 10px 12px 10px 18px; font-size: 14px; }
.cell { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; color: var(--body); }
/* activity log */
.day { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 14px 4px 6px; }
.ev { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 14px; }
.ev.sel { background: var(--signal-soft); }
.ev .av { width: 34px; height: 34px; border-radius: 10px; background: var(--cobalt); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ev .av.sys { background: var(--line-soft); color: var(--muted); }
.ev p { margin: 0; font-size: 14px; } .ev .ch { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.ev time { margin-inline-start: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.diff { width: 100%; border-collapse: collapse; font-size: 13px; } .diff th { font-size: 12px; color: var(--muted); text-align: start; padding: 6px 8px; font-weight: 600; }
.diff td { padding: 8px; border-top: 1px solid var(--line-soft); } .diff .old { color: var(--brick); text-decoration: line-through; } .diff .new { color: var(--ink); font-weight: 600; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; } .toggle i { width: 34px; height: 20px; border-radius: 99px; background: var(--ink); position: relative; } .toggle i::after { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 99px; background: var(--signal); top: 3px; right: 3px; }

.ask { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); font-size: 13px; }
.opt.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--signal-soft); }
.opt b { display: block; font-size: 13.5px; } .opt small { color: var(--muted); font-size: 12px; }
.radio { width: 18px; height: 18px; border-radius: 99px; border: 1.5px solid #9FB0AA; flex-shrink: 0; margin-top: 1px; } .opt.on .radio { border: 5px solid var(--ink); }
.warn { background: rgba(180,83,9,.08); color: var(--amber); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.err { background: rgba(192,54,44,.08); color: var(--brick); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.btnrow { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
.person { display: flex; align-items: center; gap: 10px; } .person i { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: var(--signal); display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.person small { display: block; color: var(--muted); font-size: 12px; }
.off { opacity: .55; }
.tl { display: flex; gap: 10px; padding: 7px 12px; font-size: 13px; border-top: 1px solid var(--line-soft); } .tl span:first-child { flex: 1; font-weight: 600; } .tl em { font-style: normal; color: var(--muted); font-size: 12px; }
</style></head><body>
<p class="caption"><strong>Central › Users &amp; roles.</strong> The same list-and-panel template as Studio, in the central shell. Everything shown here matches the API in <code>delorc-api/docs/api/roles-permissions.md</code>. Roles and permission counts are the real seeded data. People are invented.</p>
<div id="frames"></div>
<script>
const logo = `<svg width='34' height='34' viewBox='0 0 48 48'><rect width='48' height='48' rx='14' fill='#1B302C'/><path d='M15 28 V13 H23 A11 11 0 0 1 23 35 H21' fill='none' stroke='#C8F03C' stroke-width='4.4' stroke-linecap='round' stroke-linejoin='round'/><circle cx='15' cy='35' r='3.2' fill='#C8F03C'/></svg>`
const MENU = ['Labs', 'Plans & features', 'Channels', 'Translations', 'Usage', 'Users & roles', 'Activity']
const rail = `<nav class='rail'><div class='brand'>${logo}<span class='display'>Delorc</span></div><div style='display:flex;flex-direction:column;gap:6px'>${MENU.map(m => `<a class='${m === 'Users & roles' ? 'on' : ''}'>${m}</a>`).join('')}</div></nav>`
const LEVELS = [['People', 6], ['Roles', 4]]
function frame(n, label, { title, level = 'People', add, list, panel = '', levels = true, crumbs = 'Users & roles' }) {
  return `<div class='step-label'><b>${n}</b><span>${label}</span></div><div class='frame' style='min-height:760px'>${rail}
<div class='main'>
  <div class='topbar'><div class='search'>Search or jump to a page… <span class='kbd'>Ctrl K</span></div><span style='margin-inline-start:auto' class='avatar'>MC</span></div>
  <div style='display:flex;flex:1;gap:20px;padding:20px 28px 28px;align-items:flex-start'>
    <div style='flex:1;min-width:0;display:flex;flex-direction:column;gap:16px'>
      <div style='display:flex;justify-content:space-between;align-items:flex-end'>
        <div><div class='crumbs'>${crumbs}</div><h1 class='title display' style='font-size:36px'>${title}</h1></div>
        ${add ? `<span class='btn primary'>${add}</span>` : ''}
      </div>
      ${levels ? `<div class='levels'>${LEVELS.map(([l, c]) => `<span class='${l === level ? 'on' : ''}'>${l} <small>${c}</small></span>`).join('')}</div>` : ''}
      ${list}
    </div>${panel}
  </div>
</div></div>`
}
const chev = `<td style='color:var(--muted)'>›</td>`
const lvl = k => `<span class='lvl ${k}'><i></i><i></i><i></i><i></i></span>`

// People
const people = [
  ['MC', 'Mehdi Cherif', 'mehdi@delorc.test', 'Owner', 'App', 'Today 09:12', 'ok'],
  ['YB', 'Yacine B.', 'yacine@delorc.test', 'Owner', 'App', 'Yesterday', 'ok'],
  ['SB', 'Sara Benali', 'sara@delorc.test', 'Support', 'Email', 'Today 08:40', 'ok'],
  ['LH', 'Lina Haddad', 'lina@delorc.test', 'Translator', 'None', '2 Nov 2026', 'ok'],
  ['KT', 'Karim Toumi', 'karim@delorc.test', 'Billing', 'None', 'Never', 'wait'],
  ['NO', 'Nadia Ouali', 'nadia@delorc.test', 'Support', 'App', '12 Oct 2026', 'off'],
]
const status = s => s === 'ok' ? `<span class='chip ok'>Active</span>` : s === 'wait' ? `<span class='chip warn'>Link sent</span>` : `<span class='chip'>Deactivated</span>`
const peopleTable = (sel = -1, wide = true) => `<div class='card' style='padding:16px 18px'>
  <div style='display:flex;gap:10px;margin-bottom:12px'><div class='input muted' style='width:280px'>⌕ Search a name or email</div><span class='input'>Role <b>All</b> ▾</span><span class='input'>Status <b>All</b> ▾</span></div>
  <table class='table'><thead><tr><th>Person</th><th>Role</th><th>Status</th>${wide ? `<th>Second factor</th><th>Last sign-in</th>` : ''}<th></th></tr></thead><tbody>
  ${people.map((p, i) => `<tr class='${i === sel ? 'sel' : ''} ${p[6] === 'off' ? 'off' : ''}'><td><span class='person'><i>${p[0]}</i><span><strong>${p[1]}</strong><small>${p[2]}</small></span></span></td><td>${p[3]}</td><td>${status(p[6])}</td>${wide ? `<td class='label'>${p[4]}</td><td class='label'>${p[5]}</td>` : ''}${chev}</tr>`).join('')}</tbody></table></div>`

const personPanel = `<aside class='panel'>
  <div class='ph'><span class='ic'>SB</span><div style='flex:1'><h2 class='display'>Sara Benali</h2><div class='sub'><span class='chip ok'>Active</span><span class='chip'>Support</span></div></div><span class='icb'>✕</span></div>
  <div class='pb'>
    <section class='sec'><header><strong>Details</strong><span class='edit'>✎ Edit</span></header><div class='line'>sara@delorc.test<br>+213 555 12 34 56 · French</div></section>
    <section class='sec'><header><strong>Role</strong><span class='edit'>Change role</span></header><div class='line'>Support: read everything, edit labs, support access, export, edit translations.</div></section>
    <section class='sec'><header><strong>Signing in</strong></header>
      <div class='line'>Last sign-in today at 08:40<br>Second factor: code by email</div>
      <div class='line' style='display:flex;gap:8px'><span class='edit'>Send access link</span><span class='edit'>Reset second factor</span></div></section>
    <section class='sec'><header><strong>Deactivate</strong><span class='edit' style='color:var(--brick)'>Deactivate</span></header><div class='line hint'>Sara loses access at the next request. The name stays in the activity log.</div></section>
  </div>
</aside>`

const ownerPanel = `<aside class='panel'>
  <div class='ph'><span class='ic'>YB</span><div style='flex:1'><h2 class='display'>Yacine B.</h2><div class='sub'><span class='chip ok'>Active</span><span class='chip info'>Owner</span></div></div><span class='icb'>✕</span></div>
  <div class='pb'>
    <div class='warn'>Only an owner can change an owner. You are signed in as Support, so these actions are hidden.</div>
    <section class='sec'><header><strong>Details</strong></header><div class='line'>yacine@delorc.test</div></section>
    <section class='sec'><header><strong>Role</strong></header><div class='line'>Owner: passes every check.</div></section>
  </div>
</aside>`

const addPanel = `<aside class='panel'>
  <div class='ph'><span class='ic'>＋</span><div style='flex:1'><h2 class='display'>Add a person</h2></div><span class='icb'>✕</span></div>
  <div class='pb'>
    <label class='field'><span>Full name</span><div class='input'>Sara Benali</div></label>
    <label class='field'><span>Email</span><div class='input'>sara@delorc.test</div></label>
    <label class='field'><span>Phone <small style='color:var(--muted);font-weight:500'>optional</small></span><div class='input muted'>+213…</div></label>
    <label class='field'><span>Language</span><div class='input'>Français ▾</div></label>
    <div class='field'><span>Role</span>
      <div class='opt on'><span class='radio'></span><span><b>Support</b><small>Read everything, edit labs, support access</small></span></div>
      <div class='opt'><span class='radio'></span><span><b>Translator</b><small>Languages and translations only</small></span></div>
      <div class='opt'><span class='radio'></span><span><b>Billing</b><small>Plans, a lab's plan, usage</small></span></div>
    </div>
    <div class='hint'>No password here. Sara receives an access link, valid 48 hours, to choose a password.</div>
    <div class='btnrow'><span class='btn primary'>Add and send the link</span><span class='btn ghost'>Cancel</span></div>
  </div>
</aside>`

const roleDialog = `<aside class='panel'>
  <div class='ph'><span class='ic'>SB</span><div style='flex:1'><h2 class='display'>Change role</h2><div class='sub'><span class='chip'>Sara Benali</span></div></div><span class='icb'>✕</span></div>
  <div class='pb'>
    <div class='opt on'><span class='radio'></span><span><b>Support</b><small>Current role</small></span></div>
    <div class='opt'><span class='radio'></span><span><b>Translator</b><small>5 actions</small></span></div>
    <div class='opt'><span class='radio'></span><span><b>Billing</b><small>7 actions</small></span></div>
    <div class='opt'><span class='radio'></span><span><b>Owner</b><small>Everything. Shown only to owners.</small></span></div>
    <div class='err'>On your own account this panel is closed: “You cannot do this on your own account.”</div>
    <div class='btnrow'><span class='btn primary'>Save role</span><span class='btn ghost'>Cancel</span></div>
  </div>
</aside>`

// Roles
const roles = [['Owner', 2, 'Everything', 'f', true], ['Support', 2, '17 actions', 'e'], ['Translator', 1, '5 actions', 'e'], ['Billing', 1, '7 actions', 'e']]
const rolesTable = (sel = -1) => `<div class='card' style='padding:16px 18px'>
  <table class='table'><thead><tr><th>Role</th><th class='num'>People</th><th>Access</th><th></th></tr></thead><tbody>
  ${roles.map((r, i) => `<tr class='${i === sel ? 'sel' : ''}'><td><strong>${r[0]}</strong>${r[4] ? ` <span class='chip info' style='margin-inline-start:6px'>Protected</span>` : ''}</td><td class='num'>${r[1]}</td><td>${lvl(r[3])} <span style='margin-inline-start:8px'>${r[2]}</span></td>${chev}</tr>`).join('')}</tbody></table></div>`
const areas = [['Access', '', 'Users and roles: view', 'v'], ['Labs', '', 'View, edit, support, export', 'e'], ['Content', '', 'View, edit translations', 'e'], ['System', '', 'View', 'v']]
const rolePanel = `<aside class='panel'>
  <div class='ph'><span class='ic'>SU</span><div style='flex:1'><h2 class='display'>Support</h2></div><span class='icb'>⋯</span><span class='icb'>✕</span></div>
  <div class='pb'>
    <div class='tiles'><div class='tile'><b>2</b><span>people have this role</span></div><div class='tile'><b>17</b><span>actions allowed, in 4 areas</span></div></div>
    <section class='sec'><header><strong>Access</strong><span class='edit dark'>Edit access ↗</span></header>
      ${areas.map(a => `<div class='area'><span>${a[0]}</span>${lvl(a[3])}<em style='width:190px'>${a[2]}</em></div>`).join('')}</section>
    <section class='sec'><header><strong>Name</strong><span class='edit'>✎ Edit</span></header><div class='line'>Support</div></section>
    <section class='sec'><header><strong>Delete</strong><span class='edit' style='opacity:.45'>Delete</span></header><div class='line hint'>2 people have this role. Change their role first.</div></section>
  </div>
</aside>`

const cb = (s, chg) => s === null ? `<span style='color:var(--line)'>—</span>` : `<span class='cb ${s ? 'on' : ''} ${chg ? 'chg' : ''}'>${s ? '✓' : ''}</span>`
const extra = list => list.map(([t, on]) => `<span class='chip ${on ? 'ok' : ''}' style='margin-inline-end:4px'>${on ? '✓ ' : ''}${t}</span>`).join('')
const rows = [
  ['area', 'Access'],
  ['People', 1, 0, 0, null, [['Change role', 0], ['Reset second factor', 0]]],
  ['Roles', 1, 0, 0, 0, []],
  ['area', 'Labs'],
  ['Labs', 1, 0, 1, 0, [['Suspend', 0], ['Change plan', 0], ['Support access', 1], ['Export', 1]]],
  ['Plans', 1, 0, 0, 0, []],
  ['Channels', 1, null, 0, null, [['Test send', 0]]],
  ['Notifications', 1, null, 0, null, []],
  ['Usage', 1, null, null, null, []],
  ['area', 'Content'],
  ['Languages', 1, 0, 0, 0, []],
  ['Translations', 1, null, 1, null, [['Import', 0], ['Export', 0]]],
  ['Geography', 1, null, 0, null, [['Import', 0]]],
  ['Rule types', 1, 0, 0, 0, []],
  ['area', 'System'],
  ['Settings', 1, null, 0, null, []],
  ['Activity log', 1, null, null, null, []],
]
const accessPage = `<div class='card' style='padding:16px 18px;display:flex;flex-direction:column;gap:12px'>
  <div style='display:flex;gap:10px;align-items:center'><span class='input'>Copy access from <b>…</b> ▾</span><span class='hint' style='margin-inline-start:auto'>You can only give rights you have yourself.</span></div>
  <table class='grid'><thead><tr><th style='width:24%'>Resource</th><th>View</th><th>Add</th><th>Edit</th><th>Delete</th><th style='text-align:start'>Other actions</th></tr></thead><tbody>
  ${rows.map((r, i) => r[0] === 'area' ? `<tr class='areah'><td colspan='6'>${r[1]}<span style='float:right' class='hint'>Tick all · Clear</span></td></tr>` : `<tr><td>${r[0]}</td><td>${cb(r[1])}</td><td>${cb(r[2])}</td><td>${cb(r[3], r[0] === 'Translations')}</td><td>${cb(r[4])}</td><td style='text-align:start;white-space:normal'>${extra(r[5])}</td></tr>`).join('')}
  </tbody></table>
  <div class='savebar'><span>1 change · <span style='color:var(--on-ink-muted)'>Translations: can now edit</span></span><span class='btn ghost sm' style='margin-inline-start:auto;color:var(--mist)'>Undo</span><span class='btn primary sm'>Save access</span></div>
</div>`

document.getElementById('frames').innerHTML = [
  frame(1, `<strong>People: the page opens.</strong> “Link sent” means the person has not set a password yet. The Status filter can narrow the list to active or deactivated people.`, { title: 'People', add: '＋ Add a person', list: peopleTable() }),
  frame(2, `<strong>Click a person.</strong> All actions in one panel. Nobody is deleted: Deactivate is the end of the line. Each button appears only if your role allows it.`, { title: 'People', add: '＋ Add a person', list: peopleTable(2, false), panel: personPanel }),
  frame(3, `<strong>Add a person.</strong> Name, email, role. The API sends the access link.`, { title: 'People', list: peopleTable(-1, false), panel: addPanel }),
  frame(4, `<strong>Change role.</strong> One role per person, so radio buttons. Owner is only offered to owners.`, { title: 'People', list: peopleTable(2, false), panel: roleDialog }),
  frame(5, `<strong>Protecting owners.</strong> Someone who is not an owner can open an owner, but only to read.`, { title: 'People', list: peopleTable(1, false), panel: ownerPanel }),
  frame(6, `<strong>Roles.</strong> Owner is the only protected role. The others can be renamed, edited and deleted once nobody has them.`, { title: 'Roles', level: 'Roles', add: '＋ Add a role', list: rolesTable() }),
  frame(7, `<strong>Click a role.</strong> Same panel as the lab: access by area, then “Edit access”.`, { title: 'Roles', level: 'Roles', add: '＋ Add a role', list: rolesTable(1), panel: rolePanel }),
  frame(8, `<strong>Edit access: full page.</strong> The four usual actions in columns, anything else as a chip. “—” means that action does not exist for this resource. All 45 permissions fit on one page.`, { title: 'Support · Access', crumbs: 'Users & roles › Roles', levels: false, list: accessPage }),
].join('')
</script>
</body></html>
