<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customers — HCP record</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F54EB}a:hover{color:#1D39C4}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 1040px; box-sizing: border-box; background: #F2F4F1; color: #0F1F1C; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">

  <nav aria-label="Workspaces" style="flex: 1 1 84px; background: #0F1F1C; padding: 18px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; align-items: center">
    <svg width="44" height="44" viewBox="0 0 48 48" role="img" aria-label="Delorc">
      <rect width="48" height="48" rx="14" fill="#1B302C"></rect>
      <path d="M15 28 V13 H23 A11 11 0 0 1 23 35 H21" fill="none" stroke="#C8F03C" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="15" cy="35" r="3.2" fill="#C8F03C"></circle>
    </svg>
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 100%">
      <sc-for list="{{rail}}" as="item" hint-placeholder-count="7">
        <a href="#" aria-label="{{item.label}}" style="{{item.style}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
          <span style="font-size: 10px; font-weight: 600">{{item.label}}</span>
        </a>
      </sc-for>
    </div>
  </nav>

  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 28px; border-bottom: 1px solid #DCE3DF">
      <nav aria-label="Customers sections" style="display: flex; flex-wrap: wrap; gap: 4px">
        <a href="#" style="height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; background: #0F1F1C; color: #F2F4F1; text-decoration: none; font-size: 14px; font-weight: 600">HCPs</a>
        <a href="#" style="height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; color: #0F1F1C; text-decoration: none; font-size: 14px; font-weight: 600">HCOs</a>
        <a href="#" style="height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; color: #0F1F1C; text-decoration: none; font-size: 14px; font-weight: 600">Territories</a>
        <a href="#" style="height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; color: #0F1F1C; text-decoration: none; font-size: 14px; font-weight: 600">Consents</a>
        <a href="#" style="height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; color: #0F1F1C; text-decoration: none; font-size: 14px; font-weight: 600">Segments</a>
      </nav>
      <div style="display: flex; gap: 8px; margin-inline-start: auto; align-items: center">
        <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #DCE3DF; background: #FFFFFF; font-weight: 600; font-size: 14px">Import</button>
        <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #0F1F1C; color: #F2F4F1; font-weight: 600; font-size: 14px">+ New HCP</button>
      </div>
    </header>

    <div style="padding: 24px 28px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <!-- List -->
      <section style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <label style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #DCE3DF; border-radius: 14px; padding: 0 14px; height: 46px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search HCPs</span>
          <input type="search" placeholder="Search 2 418 HCPs" style="border: 0; outline: 0; flex-grow: 1; font: inherit; font-size: 14px; background: transparent; min-width: 0">
        </label>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <button style="height: 34px; padding: 0 12px; border-radius: 99px; border: 0; background: #0F1F1C; color: #F2F4F1; font-size: 13px; font-weight: 600">Cardiology ✕</button>
          <button style="height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid #C9D3CF; background: #FFFFFF; font-size: 13px">Priority</button>
          <button style="height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid #C9D3CF; background: #FFFFFF; font-size: 13px">Territory</button>
          <button style="height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid #C9D3CF; background: #FFFFFF; font-size: 13px">Not seen this cycle</button>
          <button style="height: 34px; padding: 0 12px; border-radius: 99px; border: 1px dashed #9AA9A4; background: transparent; font-size: 13px; color: #44544F">+ Filter</button>
        </div>
        <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden">
          <sc-for list="{{hcps}}" as="h" hint-placeholder-count="7">
            <a href="#" style="{{h.row}}">
              <span style="{{h.avatar}}">{{h.initials}}</span>
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
                <strong style="font-size: 15px">{{h.name}}</strong>
                <span style="font-size: 13px; color: #5B6B66">{{h.meta}}</span>
              </span>
              <span style="font-size: 12px; font-weight: 700; border: 1px solid #C9D3CF; border-radius: 6px; padding: 2px 7px">{{h.prio}}</span>
            </a>
          </sc-for>
        </div>
      </section>

      <!-- Record -->
      <section aria-label="HCP record" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center">
          <span style="width: 72px; height: 72px; border-radius: 22px; background: #0F1F1C; color: #C8F03C; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px">KB</span>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
            <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -0.02em">Dr. Karim Benali</h1>
            <span style="font-size: 14px; color: #5B6B66">Cardiologist · Private practice · Hydra, Alger</span>
          </div>
          <div style="display: flex; gap: 8px">
            <button style="height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid #C9D3CF; background: #FFFFFF; font-weight: 600">Edit</button>
            <button style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #C8F03C; color: #0F1F1C; font-weight: 700">Plan visit</button>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
          <div style="border: 1px solid #DCE3DF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5B6B66">Priority</span><strong style="font-size: 18px">A · 2 / cycle</strong></div>
          <div style="border: 1px solid #DCE3DF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5B6B66">This cycle</span><strong style="font-size: 18px">1 of 2 visits</strong></div>
          <div style="border: 1px solid #DCE3DF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5B6B66">Segment</span><strong style="font-size: 18px">High prescriber</strong></div>
          <div style="border: 1px solid #DCE3DF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #5B6B66">Consent</span><strong style="font-size: 18px">Email ✓ · SMS ✕</strong></div>
        </div>

        <div role="tablist" aria-label="Record sections" style="display: flex; flex-wrap: wrap; gap: 22px; border-bottom: 1px solid #DCE3DF">
          <button role="tab" aria-selected="true" style="height: 44px; border: 0; background: transparent; border-bottom: 3px solid #0F1F1C; font-weight: 700; font-size: 14px; padding: 0 2px">Timeline</button>
          <button role="tab" aria-selected="false" style="height: 44px; border: 0; background: transparent; color: #5B6B66; font-weight: 600; font-size: 14px; padding: 0 2px">Orders</button>
          <button role="tab" aria-selected="false" style="height: 44px; border: 0; background: transparent; color: #5B6B66; font-weight: 600; font-size: 14px; padding: 0 2px">Samples</button>
          <button role="tab" aria-selected="false" style="height: 44px; border: 0; background: transparent; color: #5B6B66; font-weight: 600; font-size: 14px; padding: 0 2px">Campaigns</button>
          <button role="tab" aria-selected="false" style="height: 44px; border: 0; background: transparent; color: #5B6B66; font-weight: 600; font-size: 14px; padding: 0 2px">Surveys</button>
          <button role="tab" aria-selected="false" style="height: 44px; border: 0; background: transparent; color: #5B6B66; font-weight: 600; font-size: 14px; padding: 0 2px">Details</button>
        </div>

        <div style="display: flex; flex-direction: column">
          <sc-for list="{{timeline}}" as="t" hint-placeholder-count="4">
            <div style="display: flex; gap: 16px">
              <div style="display: flex; flex-direction: column; align-items: center; width: 14px">
                <span style="{{t.dot}}"></span>
                <span style="flex-grow: 1; width: 2px; background: #DCE3DF"></span>
              </div>
              <div style="flex-grow: 1; padding-bottom: 22px; display: flex; flex-direction: column; gap: 4px">
                <div style="display: flex; justify-content: space-between; gap: 12px"><strong style="font-size: 15px">{{t.title}}</strong><span style="font-size: 13px; color: #5B6B66; white-space: nowrap">{{t.when}}</span></div>
                <span style="font-size: 14px; color: #44544F; line-height: 1.5">{{t.body}}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
renderVals() {
const ICONS = {
Today: 'M4 11 12 4l8 7v9H4z M10 20v-5h4v5',
Plan: 'M4 6h16v14H4z M4 10h16 M9 3v4 M15 3v4',
Field: 'M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z M12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
Customers: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5 M16 5.5a3 3 0 0 1 0 5.5 M18 15c2 .6 3 2.2 3 5',
Engage: 'M4 10v4h3l8 5V5L7 10z M18 9a4 4 0 0 1 0 6',
Grow: 'M4 20V11 M10 20V5 M16 20v-7 M3 20h18',
Studio: 'M4 7h16 M4 17h16 M9 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M15 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z'
};
const rail = Object.keys(ICONS).map(k => ({
label: k, d: ICONS[k],
style: 'width: 52px; height: 56px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; ' + (k === 'Customers' ? 'background: #C8F03C; color: #0F1F1C;' : 'color: #A9BBB5;')
}));
const raw = [
['Dr. Karim Benali', 'Cardiologist · Hydra · seen 21 Oct', 'A', true],
['Dr. Amel Cherif', 'Cardiologist · Kouba · seen 14 Oct', 'A', false],
['Dr. Rachid Mansouri', 'Cardiologist · Bir Mourad Raïs · not seen', 'B', false],
['Dr. Leila Bouzid', 'Cardiologist · CHU Mustapha · seen 9 Oct', 'A', false],
['Dr. Sofiane Kaci', 'Cardiologist · Chéraga · not seen', 'C', false],
['Dr. Meriem Tahar', 'Cardiologist · El Biar · seen 2 Oct', 'B', false],
['Dr. Hichem Rahmani', 'Cardiologist · Bab El Oued · not seen', 'C', false]
];
const hcps = raw.map(r => ({
name: r[0], meta: r[1], prio: r[2],
initials: r[0].replace('Dr. ', '').split(' ').map(s => s[0]).join(''),
avatar: 'width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; ' + (r[3] ? 'background: #C8F03C; color: #0F1F1C;' : 'background: #E6ECE9; color: #0F1F1C;'),
row: 'display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: #0F1F1C; border-bottom: 1px solid #EDF1EF; ' + (r[3] ? 'background: #F4FBE0;' : '')
}));
const dot = (c) => 'width: 14px; height: 14px; border-radius: 99px; flex-shrink: 0; margin-top: 4px; background: ' + c + ';';
const timeline = [
{ title: 'Visit completed · Amine K.', when: 'Today 08:30', body: '6 e-ADV slides on Cardiovex (feedback 4.5/5). 4 samples given. Wants the 10 mg study.', dot: dot('#0F1F1C') },
{ title: 'Email campaign opened', when: '17 Oct', body: '“Cardiovex 10 mg launch” · clicked the webinar link.', dot: dot('#2F54EB') },
{ title: 'Zoom session attended', when: '3 Oct', body: 'Hypertension update, 42 minutes.', dot: dot('#2F54EB') },
{ title: 'Visit completed · Amine K.', when: '12 Sep', body: 'Cycle 3. Competitor activity logged: rival rep offered congress sponsorship.', dot: dot('#0F1F1C') }
];
return { rail, hcps, timeline };
}
}
</script>
</body>
</html>
