<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اليوم — المندوب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F54EB}a:hover{color:#1D39C4}
button{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F4F1; color: #0F1F1C; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 13px; color: #5B6B66">الثلاثاء 21 أكتوبر · الجزائر الوسطى</span>
        <h1 style="margin: 0; font-weight: 700; font-size: 26px">صباح الخير أمين</h1>
      </div>
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #2F54EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">أ ك</span>
    </div>

    <section aria-label="الدورة" style="background: #0F1F1C; color: #F2F4F1; border-radius: 22px; padding: 18px; display: flex; align-items: center; gap: 16px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 52px; line-height: 0.9">78<span style="font-size: 26px; color: #C8F03C">%</span></span>
      <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
        <strong style="font-size: 15px">تغطية الدورة 4</strong>
        <div style="height: 8px; border-radius: 99px; background: #1B302C"><div style="height: 8px; width: 78%; border-radius: 99px; background: #C8F03C"></div></div>
        <span style="font-size: 12px; color: #A9BBB5">بقي 10 أيام · 4 زيارات اليوم</span>
      </div>
    </section>

    <a href="#" style="display: flex; align-items: center; justify-content: space-between; background: #C8F03C; color: #0F1F1C; border-radius: 18px; padding: 0 18px; height: 60px; text-decoration: none; font-weight: 700; font-size: 16px">
      <span>متابعة الزيارة · د. نورة سعيدي</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>

    <h2 style="margin: 4px 0 0; font-size: 17px; font-weight: 700">جولة اليوم</h2>
    <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden">
      <sc-for list="{{visits}}" as="v" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #EDF1EF">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 15px; width: 46px">{{v.time}}</span>
          <span aria-hidden="true" style="{{v.dot}}"></span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
            <strong style="font-size: 15px">{{v.name}}</strong>
            <span style="font-size: 12px; color: #5B6B66">{{v.meta}}</span>
          </div>
          <span style="font-size: 12px; font-weight: 700; color: #44544F">{{v.status}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="مساحات العمل" style="margin-top: 12px; background: #0F1F1C; padding: 10px 12px 18px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
    <a href="#" style="height: 54px; border-radius: 14px; background: #C8F03C; color: #0F1F1C; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v9H4z M10 20v-5h4v5"></path></svg>اليوم</a>
    <a href="#" style="height: 54px; border-radius: 14px; color: #A9BBB5; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4z M4 10h16 M9 3v4 M15 3v4"></path></svg>التخطيط</a>
    <a href="#" style="height: 54px; border-radius: 14px; color: #A9BBB5; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"></path></svg>الميدان</a>
    <a href="#" style="height: 54px; border-radius: 14px; color: #A9BBB5; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"></path></svg>العملاء</a>
    <a href="#" style="height: 54px; border-radius: 14px; color: #A9BBB5; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>المزيد</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dots = {
done: 'width: 12px; height: 12px; border-radius: 99px; background: #0F1F1C; flex-shrink: 0;',
live: 'width: 12px; height: 12px; border-radius: 99px; background: #C8F03C; box-shadow: 0 0 0 4px #EAF8C0; flex-shrink: 0;',
planned: 'width: 12px; height: 12px; border-radius: 99px; border: 2px solid #9AA9A4; box-sizing: border-box; flex-shrink: 0;'
};
const label = { done: 'تمت', live: 'جارية', planned: 'مخططة' };
const visits = [
['08:30', 'د. كريم بن علي', 'طب القلب · حيدرة', 'done'],
['09:40', 'صيدلية الأمل', 'صيدلية · بن عكنون', 'done'],
['10:50', 'د. نورة سعيدي', 'طب عام · الأبيار', 'live'],
['12:00', 'عيادة الزيتون', 'عيادة · دالي إبراهيم', 'planned'],
['14:30', 'د. ياسين حمدي', 'الغدد الصماء · باب الزوار', 'planned']
].map(r => ({ time: r[0], name: r[1], meta: r[2], status: label[r[3]], dot: dots[r[3]] }));
return { visits };
}
}
</script>
</body>
</html>
