<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order with packs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F54EB}a:hover{color:#1D39C4}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F4F1; color: #0F1F1C; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Visit.dc.html" aria-label="Back to visit" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE3DF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F1F1C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <strong style="font-size: 17px">New order</strong>
      <span style="font-size: 13px; color: #5B6B66">Pharmacie El Amel · via Medipharm</span>
    </div>
  </div>

  <section aria-label="Active pack" style="background: #0F1F1C; color: #F2F4F1; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <strong style="font-size: 15px">Pack Cardio · Autumn</strong>
      <span style="font-size: 12px; color: #A9BBB5">until 30 Nov</span>
    </div>
    <div style="display: flex; gap: 4px">
      <span style="flex: 1 1 0; height: 8px; border-radius: 9px; background: #C8F03C"></span>
      <span style="flex: 1 1 0; height: 8px; border-radius: 9px; background: #C8F03C"></span>
      <span style="flex: 1 1 0; height: 8px; border-radius: 9px; background: #2C4540"></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #A9BBB5"><span>20 u · 5%</span><span>40 u · 8%</span><span>60 u · 12%</span></div>
    <span style="font-size: 14px">Add <strong style="color: #C8F03C">6 units</strong> to unlock 12% (or 15% with strategic share)</span>
  </section>

  <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <strong style="font-size: 15px">{{l.name}}</strong>
          <span style="font-size: 12px; color: #5B6B66">{{l.meta}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; background: #F2F4F1; border-radius: 12px; padding: 4px">
          <button aria-label="Decrease quantity" style="width: 36px; height: 36px; border-radius: 9px; border: 0; background: #FFFFFF; font-size: 18px; font-weight: 700">−</button>
          <span style="width: 32px; text-align: center; font-weight: 700">{{l.qty}}</span>
          <button aria-label="Increase quantity" style="width: 36px; height: 36px; border-radius: 9px; border: 0; background: #0F1F1C; color: #C8F03C; font-size: 18px; font-weight: 700">+</button>
        </div>
      </div>
    </sc-for>
    <button style="height: 48px; border-radius: 16px; border: 1px dashed #9AA9A4; background: transparent; font-weight: 600; font-size: 14px; color: #44544F">+ Add product</button>
  </div>

  <section aria-label="Totals" style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
    <div style="display: flex; justify-content: space-between"><span style="color: #5B6B66">Total excl. VAT</span><span>186 400 DA</span></div>
    <div style="display: flex; justify-content: space-between"><span style="color: #5B6B66">Pack discount · 8%</span><span>− 14 912 DA</span></div>
    <div style="display: flex; justify-content: space-between"><span style="color: #5B6B66">VAT</span><span>32 583 DA</span></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #EDF1EF; padding-top: 8px"><strong>Total incl. VAT</strong><strong style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px">204 071 DA</strong></div>
  </section>

  <button style="height: 56px; border-radius: 16px; border: 0; background: #C8F03C; color: #0F1F1C; font-weight: 700; font-size: 16px">Confirm order · 54 units + 6 free</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const lines = [
{ name: 'Cardiovex 5 mg', meta: '3 400 DA · +2 free per 10 · strategic', qty: 24 },
{ name: 'Cardiovex 10 mg', meta: '4 100 DA · +1 free per 10 · strategic', qty: 18 },
{ name: 'Tensilor 80 mg', meta: '2 600 DA', qty: 12 }
];
return { lines };
}
}
</script>
</body>
</html>
